name: Compilar APK Android

on:
  push:
    branches: [mobile-nativo]
  pull_request:
    branches: [mobile-nativo]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar app-gym.apk
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas unitarias (Vitest)
        working-directory: frontend
        run: npm test

      - name: Verificar lint
        working-directory: frontend
        run: npm run lint

      - name: Compilar frontend y sincronizar Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x frontend/android/gradlew

      - name: Compilar APK con Gradle
        working-directory: frontend/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Renombrar APK final
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist-apk/app-gym.apk

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: app-gym-apk
          path: dist-apk/app-gym.apk
          if-no-files-found: error
          retention-days: 30

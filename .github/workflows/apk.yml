name: Compilar APK Android

on:
  push:
    branches: [mobile-nativo]
  pull_request:
    branches: [mobile-nativo]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Compilar app-gym.apk
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias de frontend
        working-directory: frontend
        run: npm ci

      - name: Ejecutar pruebas unitarias (Vitest)
        working-directory: frontend
        run: npm test

      - name: Verificar lint
        working-directory: frontend
        run: npm run lint

      - name: Compilar frontend y sincronizar Capacitor
        working-directory: frontend
        run: npm run cap:sync

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Dar permisos de ejecución a gradlew
        run: chmod +x frontend/android/gradlew

      - name: Preparar la clave de firma
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64: sin la clave fija el APK no se instala encima del anterior"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/app-gym-firma.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/app-gym-firma.jks" >> "$GITHUB_ENV"

      - name: Compilar APK con Gradle
        working-directory: frontend/android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Verificar la firma del APK
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs frontend/android/app/build/outputs/apk/release/app-release.apk \
            | grep -q "SHA-256 digest: $HUELLA_FIRMA" || { echo "::error::El APK no está firmado con la clave fija"; exit 1; }
        env:
          HUELLA_FIRMA: 6b820f6c0ba72132ee740dcc8d4bfcd9c7c09e9c54714269ea2c004f856f9c37

      - name: Renombrar APK final
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/release/app-release.apk dist-apk/app-gym.apk

      - name: Subir APK como artefacto de descarga
        uses: actions/upload-artifact@v4
        with:
          name: app-gym-apk
          path: dist-apk/app-gym.apk
          if-no-files-found: error
          retention-days: 30

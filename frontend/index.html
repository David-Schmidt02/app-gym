<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f0ec" />
    <script>
      // Tema antes del primer pintado (misma lógica que src/estado/tema.js)
      (function () {
        var preferencia = 'sistema';
        try {
          preferencia = localStorage.getItem('gym.tema') || 'sistema';
        } catch (e) {}
        var oscuro = preferencia === 'oscuro' || (preferencia === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = oscuro ? 'dark' : 'light';
        if (oscuro) document.querySelector('meta[name="theme-color"]').setAttribute('content', '#141210');
      })();
    </script>
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Gym" />
    <link rel="icon" type="image/svg+xml" href="/icono.svg" />
    <link rel="apple-touch-icon" href="/icono-180.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Gym</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
